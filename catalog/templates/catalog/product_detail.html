{% extends 'base.html' %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<h1>{{ product.name }}</h1>
{% if product.image %}
<img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid">
{% endif %}
<p>{{ product.description }}</p>
<p><strong>Цена:</strong> {{ product.price }} ₽</p>
<a href="/" class="btn btn-secondary">Назад</a>
{% endblock %}
