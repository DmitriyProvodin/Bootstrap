{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyShop{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="d-flex" style="min-height: 100vh;">
    <!-- Sidebar -->
    <aside class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 260px;">
      <a class="navbar-brand text-white mb-3" href="#"><strong>Меню</strong></a>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item"><a class="nav-link {% block nav_home %}{% endblock %} text-white" href="/">Главная</a></li>
        <li><a class="nav-link {% block nav_catalog %}{% endblock %} text-white" href="/catalog/">Каталог</a></li>
        <li><a class="nav-link text-white" href="#">Заказы</a></li>
        <li><a class="nav-link {% block nav_contacts %}{% endblock %} text-white" href="/contacts/">Контакты</a></li>
      </ul>
    </aside>

    <!-- Content -->
    <section class="container-fluid p-4">
      {% block content %}{% endblock %}
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
