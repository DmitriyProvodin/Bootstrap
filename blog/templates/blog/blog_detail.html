{% extends "base.html" %}
{% block content %}
<h2>{{ post.title }}</h2>
{% if post.preview %}
  <img src="{{ post.preview.url }}" class="img-fluid" alt="{{ post.title }}">
{% endif %}
<p>{{ post.content }}</p>
<p><small>Просмотров: {{ post.views_count }}</small></p>
<a href="{% url 'blog:blog_update' post.pk %}" class="btn btn-warning">Редактировать</a>
<a href="{% url 'blog:blog_delete' post.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Назад</a>
{% endblock %}
