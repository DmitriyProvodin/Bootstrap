version: '3.9'

services:
  backend:
    build: ./backend
    container_name: backend
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  celery:
    build: ./backend
    container_name: celery
    command: celery -A core worker -l info
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - db
    volumes:
      - .:/app

  celery_beat:
    build: ./backend
    container_name: celery_beat
    command: celery -A core beat -l info
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
