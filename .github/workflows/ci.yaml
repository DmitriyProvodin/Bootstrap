name: CI/CD

on:
  push:
    branches:
      - hw-01

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v3

    - name: Install Docker
      uses: docker/setup-buildx-action@v3

    - name: Build
      run: docker build -t bootstrap .

    - name: Run tests
      run: |
        docker-compose run --rm web python manage.py test
