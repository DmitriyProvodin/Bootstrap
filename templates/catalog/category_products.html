{% extends 'base.html' %}
{% block content %}
<h2>Товары в категории: {{ category.name }}</h2>
<div class="row">
  {% for product in products %}
    <div class="col-md-4">
      <div class="card mb-3">
        <div class="card-body">
          <h5>{{ product.name }}</h5>
          <p>{{ product.price }} ₽</p>
          <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-primary">Подробнее</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p>Нет товаров в этой категории.</p>
  {% endfor %}
</div>
{% endblock %}
