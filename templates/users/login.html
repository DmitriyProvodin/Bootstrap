{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<h2>Вход</h2>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Войти</button>
</form>
{% endblock %}
