
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакты</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h1 class="mb-4 text-center">Контакты</h1>
  <div class="row g-4">
    <div class="col-md-6">
      <form class="card p-3">
        <div class="mb-3">
          <label class="form-label">Имя</label>
          <input type="text" class="form-control" placeholder="Иван">
        </div>
        <div class="mb-3">
          <label class="form-label">Почта</label>
          <input type="email" class="form-control" placeholder="mail@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Сообщение</label>
          <textarea class="form-control" rows="4" placeholder="Ваше сообщение"></textarea>
        </div>
        <button class="btn btn-primary">Отправить</button>
      </form>
    </div>
    <div class="col-md-6">
      <div class="card p-3">
        <h5>Наши контакты</h5>
        <p class="text-muted mb-0">Адрес: ул. Примерная, 1</p>
        <p class="text-muted mb-0">Телефон: +7 (900) 000-00-00</p>
        <p class="text-muted">Email: info@example.com</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
