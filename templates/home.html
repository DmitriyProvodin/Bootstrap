
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h1 class="mb-4">Главная</h1>
  <div class="row g-3">
    {% for p in latest %}
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ p.name }}</h5>
          <p class="card-text">{{ p.description|default:"Нет описания" }}</p>
          <span class="badge text-bg-secondary">{{ p.price }} ₽</span>
        </div>
      </div>
    </div>
    {% empty %}
    <p>Нет продуктов</p>
    {% endfor %}
  </div>
  <a href="/contacts/" class="btn btn-primary mt-4">Контакты</a>
</div>
</body>
</html>
